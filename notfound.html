<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">

  <title>NotFound - 御昼野だいにんぐ</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #FFFFFF;
min-height: 100vh; 
display: flex; 
flex-direction: column;
color: #47266e;
    }

/* --- 固定ヘッダー（赤） --- */ 
header { 
position: fixed; 
top: 0; left: 0; 
width: 100%; 
height: 32px;
background: #FF6666; 
color: white; 
display: flex; 
align-items: center; 
justify-content: center; 
font-size: 12px;
padding: 0 8px; 
z-index: 1000; 
text-align: center; 
white-space: normal;
line-height: 1.2; 
overflow-wrap: break-word; 
}

/* --- メニューボタン --- */ 
.menu-button { 
width: 40px; 
height: 40px; 
background: #b79fcb; 
cursor: pointer; 
display: flex; 
align-items: center; 
justify-content: center;
z-index: 1002;
position: relative;  
} 
.menu-button span { 
display: block; 
width: 22px; 
height: 2px; 
background: #fff; 
position: relative; 
} 
.menu-button span::before, 
.menu-button span::after { 
content: ""; 
position: absolute; 
left: 0; 
width: 22px; 
height: 2px; 
background: #fff; 
} 
.menu-button span::before { 
top: -6px; 
} 
.menu-button span::after { 
top: 6px; 
}

/* --- 第2の固定バー --- */ 
.top-bar { 
position: fixed; 
top: 32px;
left: 0; 
width: 100%; 
height: 40px; 
background: #fff9ff; 
border-bottom: 1px solid #b79fcb; 
z-index: 1001; 
display: flex; 
align-items: center; 
justify-content: space-between; 
box-sizing: border-box; 
padding: 0 8px; 
}

/* --- 検索ウィンドウ（右端固定） --- */ 
.search-window { 
font-size: 12px; 
color: #b79fcb; 
white-space: nowrap; }
#searchInput {
  background: #FFF;
  color: #47266e;
  border: 1px solid #b79fcb;
  padding: 4px 6px;
  border-radius: 4px;
}
#searchButton {
  background: #b79fcb;
  color: white;
  border: none;
  padding: 4px 10px;
  border-radius: 4px;
  cursor: pointer;
}
#searchInput::placeholder {
  color: #d1bada;
}



/* --- 左スライドメニュー --- */ 
nav { 
position: fixed; 
top: 72px;
left: 0; 
width: 250px; 
height: calc(100% - 72px - 60px); 
background: #fff9ff; 
border-right: 1px solid #e0b5d3; 
padding: 16px; 
box-sizing: border-box; 
transform: translateX(-100%); 
transition: transform 0.3s ease; 
z-index: 1000; 
} 
nav.open { 
transform: translateX(0); 
}

/* --- 本文 --- */ 
main { 
flex: 1; 
margin-top: 72px;
margin-bottom: 60px; 
padding: 20px; 
background: white; 
min-height: 100vh; 
text-align: left; }

.content-wrapper { 
flex: 1; 
display: flex; 
flex-direction: column; 
padding-bottom: 60px;
max-width: 70%;  
margin: 0 auto; 
padding: 0 20px;
z-index: 1; 
position: relative;
}

footer {
  position: fixed;
  bottom: 0;
  left: 0;
  width: calc(100% - 16px);
  height: 60px;
  background: #b79fcb;
  color: white;
  display: flex;
  align-items: center;
  justify-content: flex-end;

  padding-left: 16px;
  padding-right: 32px;

  z-index: 1000;

  white-space: normal;
  overflow-wrap: break-word;
  text-align: right;
  overflow: hidden;
}

/* 本文用フッター */ 
.content-footer { 
background: #d1bada; 
color: white; 
text-align: center; 
padding: 12px 8px; 
font-size: 14px; 
margin-bottom: 60px;
}

.main-image { 
width: 100%;
display: block; 
margin: 20px auto;
}

/* メニューのボタン */
.mb {
  display: inline-block;
  padding: 10px 20px;
  color: #47266e;
  text-decoration: none;
  border-radius: 4px;
}



  </style>
</head>
<body>

<header>

</nav>

  <div class="content-wrapper">
    <main>

<script>
  const menuButton = document.querySelector('.menu-button');
  const nav = document.getElementById('nav');

  menuButton.addEventListener('click', () => {
    nav.classList.toggle('open');
  });
</script>
<script>
  function updateFooterPadding() {
    // スクロールバー幅を計算
    const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;

    // フッター要素を取得
    const footer = document.querySelector('footer');

    // 右側の余白をスクロールバー幅ぶん追加
    footer.style.paddingRight = (32 + scrollbarWidth) + 'px';
  }

  // 初回実行
  updateFooterPadding();

  // ウィンドウサイズが変わったら再計算
  window.addEventListener('resize', updateFooterPadding);



</script>

<script>
const params = new URLSearchParams(window.location.search);
const word = params.get("word");

if (word) {
  const target = document.getElementById("searchedWord");
  target.textContent = word;
}

</script>

<script src="js/search.js"></script>
</body>
